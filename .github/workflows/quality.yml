name: Quality measurements

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '21 5 * * 1'

permissions:
  contents: read

jobs:
  measurements:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v4
        with:
          version: '2026.10.11'
          install: true
      - run: npm ci
      - id: lint
        run: npm run lint:report && npm run lint:baseline && npm run test:quality
      - id: dependencies
        run: npm run report:dependencies
      - id: coverage
        run: npm run test:coverage
      - name: Select relevant mutation pilots
        id: pilot
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          changed="$(git diff --name-only "$BASE_SHA" HEAD -- src tests/unit/core.test.ts tests/unit/environment.test.ts tests/unit/events.test.ts tests/unit/config.test.ts package.json package-lock.json 'stryker*.json' 'vitest*mutation.config.ts' scripts/check-mutation.mjs scripts/summarize-quality.mjs .github/workflows/quality.yml)"
          if [ -n "$changed" ]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Focused config and execution mutation pilots
        id: mutation
        if: github.event_name != 'pull_request' || steps.pilot.outputs.run == 'true'
        run: npm run test:mutation && npm run test:mutation:core && npm run test:mutation:check
      - name: Publish verified measurement evidence
        if: always()
        env:
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          DEPENDENCY_OUTCOME: ${{ steps.dependencies.outcome }}
          COVERAGE_OUTCOME: ${{ steps.coverage.outcome }}
          MUTATION_OUTCOME: ${{ steps.mutation.outcome }}
        run: node scripts/summarize-quality.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-measurements
          path: |
            coverage/
            reports/
          if-no-files-found: error
          retention-days: 14
