name: Arch checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
        with:
          version: '2026.10.11'
          install: true
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm run experiment
      - run: npm run test:unit -- --reporter=default --reporter=json --outputFile=.test-state/m2-unit.json
      - run: npm run test:integration -- --reporter=default --reporter=json --outputFile=.test-state/m2-integration.json
      - run: npm run test:acceptance -- --reporter=default --reporter=json --outputFile=.test-state/m2-acceptance.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: routing-evidence-${{ matrix.os }}
          path: |
            .test-state/mise-*.json
            .test-state/m2-*.json
          include-hidden-files: true
