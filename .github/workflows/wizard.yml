name: Wizard checks

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/wizard.yml'
      - 'src/**'
      - 'scripts/check-wizard.mjs'
      - 'tests/unit/wizard.test.ts'
      - 'tests/unit/discovery.test.ts'
      - 'package*.json'
      - 'tsconfig*.json'
  pull_request:
    paths:
      - '.github/workflows/wizard.yml'
      - 'src/**'
      - 'scripts/check-wizard.mjs'
      - 'tests/unit/wizard.test.ts'
      - 'tests/unit/discovery.test.ts'
      - 'package*.json'
      - 'tsconfig*.json'

permissions:
  contents: read

concurrency:
  group: wizard-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wizard:
    name: Wizard (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24.19.0'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Wizard and discovery unit tests
        run: npm exec -- vitest run tests/unit/wizard.test.ts tests/unit/discovery.test.ts --reporter=default --reporter=json --outputFile=.test-state/wizard/unit.json
      - name: Real terminal wizard scenarios
        run: npm run test:wizard:terminal
      - name: Publish wizard test summary
        if: always()
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, existsSync, readFileSync } from 'node:fs';
          const read = path => existsSync(path) ? JSON.parse(readFileSync(path, 'utf8')) : undefined;
          const unit = read('.test-state/wizard/unit.json');
          const terminal = read('.test-state/wizard/results.json');
          const lines = ['## Wizard checks', '', '| Area | Result |', '| --- | --- |',
            `| Unit tests | ${unit ? `${unit.numPassedTests} passed, ${unit.numFailedTests} failed` : 'NOT RUN / no evidence'} |`,
            `| Real terminal | ${terminal?.result ?? 'NOT RUN / no evidence'} |`];
          if (terminal) {
            lines.push('', `Terminal host: ${terminal.platform}/${terminal.arch}, Node ${terminal.node}.`, '', '| Scenario | Result |', '| --- | --- |');
            for (const check of terminal.checks) lines.push(`| ${check.name} | ${check.result} |`);
            for (const preparation of terminal.ptyPreparation ?? []) console.log(`::notice title=Wizard PTY preparation::${preparation.helper}: executable bit restored ${preparation.executableBitRestored}`);
          }
          lines.push('', 'Transcripts and JSON evidence are uploaded as artifacts. No installed AI CLI is invoked.');
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n') + '\n');
          const escape = text => text.slice(0, 12000).replaceAll('%', '%25').replaceAll('\r', '%0D').replaceAll('\n', '%0A');
          for (const file of unit?.testResults ?? []) {
            for (const test of file.assertionResults ?? []) {
              if (test.status === 'failed') console.log(`::error title=Wizard unit failure::${escape(`${test.fullName}: ${(test.failureMessages ?? []).join('\n')}`)}`);
            }
          }
          for (const check of terminal?.checks ?? []) {
            if (check.result === 'FAIL') console.log(`::error title=Wizard terminal failure::${escape(`${check.name}: ${check.error ?? ''}`)}`);
          }
          console.log(`::notice title=Wizard evidence::unit ${unit ? `${unit.numPassedTests} passed, ${unit.numFailedTests} failed` : 'NOT RUN'}; terminal ${terminal?.result ?? 'NOT RUN'}; ${terminal?.checks.length ?? 0} scenarios`);
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wizard-evidence-${{ matrix.os }}
          path: .test-state/wizard/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
